<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Saralene's Reunion Olympics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

    --navy:#182536;
    --navy-2:#22344A;
    --navy-3:#2C4260;
    --green:#2E5339;
    --green-2:#3A6647;
    --gold:#E8A93C;
    --gold-dim:#B98730;
    --red:#C4432E;
    --chalk:#F4EFE4;
    --denim:#8AA6B8;
    --line:#3C5470;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:
      radial-gradient(circle at 15% 0%, #24384f 0%, transparent 45%),
      radial-gradient(circle at 90% 8%, #2b4a3a 0%, transparent 40%),
      var(--navy);
    color:var(--chalk);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  ::-webkit-scrollbar{height:6px; width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  /* ---------- Header / patch ---------- */
  .app-header{
    padding:22px 20px 16px;
    text-align:center;
    position:relative;
    border-bottom:2px dashed var(--line);
  }
  .app-header .kicker{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.24em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .app-header h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:30px;
    line-height:1.02;
    letter-spacing:.01em;
    margin:0;
    color:var(--chalk);
    text-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  .app-header h1 .accent{color:var(--gold);}
  .app-header .tagline{
    margin-top:8px;
    font-size:13px;
    color:var(--denim);
    font-style:italic;
  }
  .back-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 4px;
  }
  .icon-btn{
    background:var(--navy-2);
    border:1px solid var(--line);
    color:var(--chalk);
    border-radius:10px;
    padding:9px 13px;
    font-size:14px;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    display:inline-flex; align-items:center; gap:6px;
    cursor:pointer;
  }
  .icon-btn:active{transform:scale(.97);}
  .icon-btn.danger{color:#F0A493; border-color:#5a3128;}

  /* ---------- Home ---------- */
  .home-body{padding:18px; flex:1; display:flex; flex-direction:column; gap:14px;}
  .new-event-btn{
    background:linear-gradient(180deg,#F0B75A, var(--gold));
    color:#231705;
    border:none;
    border-radius:var(--radius);
    padding:16px;
    font-family:'Anton', sans-serif;
    font-size:17px;

  .section-label{
    font-family:'Space Mono', monospace;
    font-size:11px;

    text-transform:uppercase;
    color:var(--denim);
    margin:6px 2px 0;
  }

  .year-group{ display:flex; flex-direction:column; gap:10px; }
  .year-header{
    display:flex; align-items:center; gap:9px;
    cursor:pointer;
    padding:10px 4px 8px;
    border-bottom:2px solid var(--line);
  }
  .year-chevron{ color:var(--gold); font-size:12px; width:10px; }
  .year-title{
    font-family:'Anton', sans-serif;

  .year-count{

  .event-card::before{

  /* ---------- New bracket form ---------- */

  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{

    border:1px solid var(--line);

  .format-row{display:flex; gap:10px;}
  .year-stepper{

  .count-hint{font-size:12px; color:var(--denim); margin-top:6px;}

  .generate-btn{

  /* ---------- Bracket view ---------- */
  .bracket-head{padding:14px 18px 6px;}
  .bracket-head .ev-game{font-family:'Anton',sans-serif; font-size:22px;}

  .champion-banner{

  .champion-banner .cb-label{font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.2em; color:var(--gold); text-transform:uppercase;}
  .champion-banner .cb-name{font-family:'Anton', sans-serif; font-size:24px; margin-top:6px; color:var(--chalk);}

  .tabs{display:flex; gap:8px; padding:14px 18px 0;}
  .tab{
    flex:1;
    text-align:center;

  .bracket-scroll{

  .round-row{
    display:flex;
    padding:0 18px;

  .round-col{

  .round-title{
    font-family:'Space Mono', monospace;

  .slot{

    border-bottom:1px solid var(--line);

    gap:6px;
  }
  .slot:last-child{border-bottom:none;}
  .slot .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .slot.tbd .nm{color:#54677D; font-style:italic; font-weight:500;}
  .slot.bye .nm{color:#54677D; font-weight:500;}
  .slot.pickable{cursor:pointer;}
  .slot.pickable:active{background:#2c3a4d;}
  .slot.winner{color:#FFE9BE;}
  .slot.winner .nm::before{content:"🏆 "; font-size:11px;}
  .slot.loser{color:#5c7186; text-decoration:line-through; text-decoration-color:#42566c;}
  .tap-hint{font-family:'Space Mono',monospace; font-size:9px; color:var(--gold-dim); opacity:.85;}

  .gf-note{
    margin:0 18px 14px;
    font-size:12px;
    color:var(--denim);
    line-height:1.5;
    background:var(--navy-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 13px;
  }

  .gf2-inactive{
    margin:0 18px;
    padding:22px;
    text-align:center;
    color:var(--denim);
    font-size:13px;
    border:1.5px dashed var(--line);
    border-radius:var(--radius);

  .fab-spacer{height:14px;}
  a, button{font-family:inherit;}

  .loading{display:flex; align-items:center; justify-content:center; height:70vh; color:var(--denim); font-family:'Space Mono',monospace; font-size:13px;}

  .save-banner{
    display:flex; align-items:center; gap:10px;
    background:#3a1f1a;
    border-bottom:1px solid #5a3128;
    color:#F0C4B4;
    padding:10px 16px;
    font-size:12.5px;
    line-height:1.4;
  }
  .save-banner .sb-text{flex:1;}
  .save-banner .sb-retry{
    background:var(--red);
    color:#FFEFE9;
    border:none;
    border-radius:8px;
    padding:7px 12px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
</style>

<body>
<div id="app"></div>

<script>
/* ============================= STATE ============================= */
const STORAGE_KEY = 'app-data';
let _mid = 0;

let state = {
  view: 'home',            // home | new | bracket
  loading: true,
  data: { brackets:{}, order:[] },
  currentId: null,
  bracketTab: 'W',          // W | L | GF  (double elim view)
  form: { name:'', format:'single', text:'', year: new Date().getFullYear(), error:'' },
  collapsedYears: {},       // year -> true if collapsed on home screen
  editingYear: false,       // whether the year-edit stepper is open on the bracket screen
  saveError: false          // true if the last save to storage failed after retries
};

function currentYear(){ return new Date().getFullYear(); }
function bracketYear(b){ return b.year || new Date(b.createdAt).getFullYear(); }

/* ============================= STORAGE ============================= */
// Works two ways: inside Claude.ai it uses Claude's persistent storage API.
// Hosted standalone (e.g. GitHub Pages) it falls back to the browser's
// localStorage, so the exact same file works in both places.
const hasClaudeStorage = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function';

async function storageGet(key){
  if(hasClaudeStorage) return window.storage.get(key, false);
  const raw = localStorage.getItem(key);
  return raw ? { key, value: raw, shared:false } : null;
}
async function storageSet(key, value){
  if(hasClaudeStorage) return window.storage.set(key, value, false);
  localStorage.setItem(key, value);
  return { key, value, shared:false };
}

async function loadData(){
  try{
    const res = await storageGet(STORAGE_KEY);
    state.data = res ? JSON.parse(res.value) : { brackets:{}, order:[] };
  }catch(e){
    state.data = { brackets:{}, order:[] };
  }
  state.loading = false;
  render();
}
async function saveData(){
  const payload = JSON.stringify(state.data);
  for(let attempt=0; attempt<3; attempt++){
    try{
      const res = await storageSet(STORAGE_KEY, payload);
      if(res){
        if(state.saveError){ state.saveError = false; render(); }
        return true;
      }
    }catch(e){
      console.error('save attempt '+(attempt+1)+' failed:', e);
    }
    if(attempt < 2) await new Promise(r=>setTimeout(r, 500*(attempt+1)));
  }
  // All retries failed — surface it instead of hiding it in the console.
  state.saveError = true;
  render();
  return false;
}

/* ============================= BRACKET GENERATION ============================= */
function nextPow2(n){ let p=1; while(p<n) p*=2; return Math.max(p,2); }
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function makeSlot(name){ return { name: name==null?null:name, isBye: name==='BYE' }; }
function newMatch(section, round, n1, n2, extra){
  _mid++;
  return Object.assign({
    id:'m'+_mid, section, round, roundLabel:'',
    slot1: makeSlot(n1), slot2: makeSlot(n2),
    winner:null, winnerTarget:null, loserTarget:null, active:true
  }, extra||{});
}
function findM(matches, id){ return matches.find(m=>m.id===id); }

function propagate(matches, m){
  const loserName = (m.winner===m.slot1.name) ? m.slot2.name : m.slot1.name;
  if(m.winnerTarget) setSlot(matches, m.winnerTarget.matchId, m.winnerTarget.slot, m.winner);
  if(m.loserTarget) setSlot(matches, m.loserTarget.matchId, m.loserTarget.slot, loserName);
}
function setSlot(matches, matchId, slotNum, name){
  const m = findM(matches, matchId); if(!m) return;
  if(slotNum===1) m.slot1 = makeSlot(name); else m.slot2 = makeSlot(name);
  maybeAutoResolveBye(matches, m);
}
function maybeAutoResolveBye(matches, m){
  if(m.winner) return;
  if(m.slot1.name && m.slot2.name){
    if(m.slot1.isBye || m.slot2.isBye){
      const w = (m.slot1.isBye && m.slot2.isBye) ? 'BYE' : (m.slot1.isBye ? m.slot2.name : m.slot1.name);
      m.winner = w;
      propagate(matches, m);
    }
  }
}

function labelRounds(matches, kRounds, format){
  matches.forEach(m=>{
    if(m.section==='W'){
      const fromEnd = kRounds - m.round;
      if(format==='single'){
        m.roundLabel = fromEnd===0 ? 'Final' : fromEnd===1 ? 'Semifinal' : fromEnd===2 ? 'Quarterfinal' : `Round ${m.round}`;
      } else {
        m.roundLabel = fromEnd===0 ? 'Winners Final' : fromEnd===1 ? 'Winners Semi' : `Winners Rd ${m.round}`;
      }
    } else if(m.section==='L'){
      m.roundLabel = `Losers Rd ${m.round}`;
    }
  });
  // mark true last losers round as "Losers Final"
  const lRounds = matches.filter(m=>m.section==='L').map(m=>m.round);
  if(lRounds.length){
    const maxL = Math.max(...lRounds);
    matches.filter(m=>m.section==='L' && m.round===maxL).forEach(m=> m.roundLabel='Losers Final');
  }
}

function buildSingle(participants){
  const shuffled = shuffle(participants);
  const size = nextPow2(shuffled.length);
  const padded = shuffled.concat(Array(size-shuffled.length).fill('BYE'));
  const matches = [];
  let prev = [];
  for(let i=0;i<size/2;i++){
    const m = newMatch('W',1,padded[2*i],padded[2*i+1]);
    matches.push(m); prev.push(m);
  }
  const rounds = Math.log2(size);
  for(let r=2;r<=rounds;r++){
    const cur=[];
    for(let i=0;i<prev.length/2;i++){
      const m = newMatch('W', r, null, null);
      matches.push(m);
      prev[2*i].winnerTarget = { matchId:m.id, slot:1 };
      prev[2*i+1].winnerTarget = { matchId:m.id, slot:2 };
      cur.push(m);
    }
    prev = cur;
  }
  labelRounds(matches, rounds, 'single');
  matches.filter(m=>m.round===1 && m.section==='W').forEach(m=>maybeAutoResolveBye(matches,m));
  const bracket = { matches, meta:{ rounds, size }, champion:null };
  const final = matches.find(m=>m.section==='W' && m.round===rounds);
  if(final && final.winner) bracket.champion = final.winner;
  return bracket;
}

function buildDouble(participants){
  const shuffled = shuffle(participants);
  const size = Math.max(nextPow2(shuffled.length), 4);
  const padded = shuffled.concat(Array(size-shuffled.length).fill('BYE'));
  const k = Math.log2(size);
  const matches = [];
  const wbRounds = [];
  let prev = [];
  for(let i=0;i<size/2;i++){
    const m = newMatch('W',1,padded[2*i],padded[2*i+1]);
    matches.push(m); prev.push(m);
  }
  wbRounds.push(prev);
  for(let r=2;r<=k;r++){
    const cur=[];
    for(let i=0;i<prev.length/2;i++){
      const m = newMatch('W', r, null, null);
      matches.push(m);
      prev[2*i].winnerTarget = { matchId:m.id, slot:1 };
      prev[2*i+1].winnerTarget = { matchId:m.id, slot:2 };
      cur.push(m);
    }
    prev = cur; wbRounds.push(cur);
  }
  const wbFinal = wbRounds[k-1][0];

  let lbRoundNum = 1;
  let lbFrontier = [];
  const wb1 = wbRounds[0];
  for(let i=0;i<wb1.length/2;i++){
    const m = newMatch('L', lbRoundNum, null, null);
    matches.push(m);
    wb1[2*i].loserTarget = { matchId:m.id, slot:1 };
    wb1[2*i+1].loserTarget = { matchId:m.id, slot:2 };
    lbFrontier.push(m);
  }
  lbRoundNum++;
  let lbFinal = lbFrontier[0];

  for(let wbR=2; wbR<=k; wbR++){
    const wbLosers = wbRounds[wbR-1];
    const typeA = [];
    for(let i=0;i<lbFrontier.length;i++){
      const m = newMatch('L', lbRoundNum, null, null);
      matches.push(m);
      lbFrontier[i].winnerTarget = { matchId:m.id, slot:1 };
      wbLosers[i].loserTarget = { matchId:m.id, slot:2 };
      typeA.push(m);
    }
    lbRoundNum++;
    lbFrontier = typeA;
    if(wbR < k){
      const typeB = [];
      for(let i=0;i<lbFrontier.length/2;i++){
        const m = newMatch('L', lbRoundNum, null, null);
        matches.push(m);
        lbFrontier[2*i].winnerTarget = { matchId:m.id, slot:1 };
        lbFrontier[2*i+1].winnerTarget = { matchId:m.id, slot:2 };
        typeB.push(m);
      }
      lbRoundNum++;
      lbFrontier = typeB;
    } else {
      lbFinal = lbFrontier[0];
    }
  }

  const gf1 = newMatch('GF', 1, null, null, { type:'GF1' });
  matches.push(gf1);
  wbFinal.winnerTarget = { matchId:gf1.id, slot:1 };
  lbFinal.winnerTarget = { matchId:gf1.id, slot:2 };
  const gf2 = newMatch('GF', 2, null, null, { type:'GF2', active:false });
  matches.push(gf2);
  gf1.gf2Id = gf2.id;

  labelRounds(matches, k, 'double');
  matches.filter(m=>m.round===1 && m.section==='W').forEach(m=>maybeAutoResolveBye(matches,m));

  const bracket = { matches, meta:{ rounds:k, size }, champion:null };
  if(gf1.winner){
    bracket.champion = (gf1.winner===gf1.slot1.name) ? gf1.winner : null; // rare auto-bye edge case
  }
  return bracket;
}

/* ============================= BRACKET ACTIONS ============================= */
// Keeps grand-final activation and champion detection correct no matter whether
// a match was decided by a human tap or auto-resolved through a bye cascade.
function syncMeta(bracket){
  const matches = bracket.matches;
  const gf1 = matches.find(m=>m.type==='GF1');
  if(gf1){
    const gf2 = matches.find(m=>m.type==='GF2');
    if(gf1.winner && gf2 && !gf2.winner){
      if(gf1.winner === gf1.slot1.name){
        gf2.active = false;
        bracket.champion = gf1.winner; // winners-bracket finalist won it in one
      } else {
        gf2.active = true; // losers-bracket finalist forced a decider match
        if(!gf2.slot1.name){
          gf2.slot1 = makeSlot(gf1.winner);     // came through the losers bracket, still alive
          gf2.slot2 = makeSlot(gf1.slot1.name); // winners-bracket side, now has one loss
        }
        bracket.champion = null;
      }
    } else if(gf2 && gf2.winner){
      bracket.champion = gf2.winner;
    } else if(!gf1.winner){
      bracket.champion = null;
    }
  } else {
    const final = matches.find(m=>m.section==='W' && !m.winnerTarget && !m.loserTarget);
    bracket.champion = (final && final.winner) ? final.winner : null;
  }
}

function declareWinner(bracket, matchId, winnerName){
  const matches = bracket.matches;
  function clearDecision(m){
    if(!m.winner) return;
    m.winner = null;
    if(m.winnerTarget) clearSlotRec(m.winnerTarget.matchId, m.winnerTarget.slot);
    if(m.loserTarget) clearSlotRec(m.loserTarget.matchId, m.loserTarget.slot);
    if(m.type==='GF1' && m.gf2Id){
      const gf2 = findM(matches, m.gf2Id);
      if(gf2){ gf2.active=false; gf2.slot1=makeSlot(null); gf2.slot2=makeSlot(null); clearDecision(gf2); }
    }
  }
  function clearSlotRec(id, slotNum){
    const m = findM(matches, id); if(!m) return;
    clearDecision(m);
    if(slotNum===1) m.slot1=makeSlot(null); else m.slot2=makeSlot(null);
  }

  const m = findM(matches, matchId);
  if(!m) return;
  if(m.winner) clearDecision(m); // allow changing a pick; clears anything downstream first

  m.winner = winnerName;
  const loserName = (winnerName===m.slot1.name) ? m.slot2.name : m.slot1.name;
  if(m.winnerTarget){
    const t = findM(matches, m.winnerTarget.matchId);
    if(t){ if(m.winnerTarget.slot===1) t.slot1=makeSlot(winnerName); else t.slot2=makeSlot(winnerName); maybeAutoResolveBye(matches, t); }
  }
  if(m.loserTarget){
    const t = findM(matches, m.loserTarget.matchId);
    if(t){ if(m.loserTarget.slot===1) t.slot1=makeSlot(loserName); else t.slot2=makeSlot(loserName); maybeAutoResolveBye(matches, t); }
  }
  syncMeta(bracket);
  saveData();
  render();
}

function createBracket(name, game, format, participants, year){
  const id = 'b'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  const built = format==='single' ? buildSingle(participants) : buildDouble(participants);
  const bracket = {
    id, name, game, format,
    year: year || currentYear(),
    createdAt: Date.now(),
    participants,
    matches: built.matches,
    meta: built.meta,
    champion: built.champion
  };
  syncMeta(bracket);
  state.data.brackets[id] = bracket;
  state.data.order.unshift(id);
  saveData();
  return id;
}
function setBracketYear(id, year){
  const b = state.data.brackets[id];
  if(!b) return;
  b.year = year;
  saveData();
}
function deleteBracket(id){
  delete state.data.brackets[id];
  state.data.order = state.data.order.filter(x=>x!==id);
  saveData();
}

/* ============================= HELPERS ============================= */
function esc(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
}
function byRound(matches, section){
  const rounds = {};
  matches.filter(m=>m.section===section).forEach(m=>{
    (rounds[m.round] = rounds[m.round]||[]).push(m);
  });
  return Object.keys(rounds).sort((a,b)=>a-b).map(r=>rounds[r]);
}

/* ============================= RENDER: SLOT / MATCH ============================= */
function renderSlot(bracket, m, which){
  const slot = which===1 ? m.slot1 : m.slot2;
  const otherSlot = which===1 ? m.slot2 : m.slot1;
  const isWinner = m.winner && slot.name===m.winner;
  const isLoser = m.winner && slot.name && slot.name!==m.winner;
  const bothFilled = m.slot1.name && m.slot2.name;
  const pickable = bothFilled && !m.winner && slot.name && !slot.isBye;

  let cls = 'slot';
  if(!slot.name) cls += ' tbd';
  else if(slot.isBye) cls += ' bye';
  if(isWinner) cls += ' winner';
  if(isLoser) cls += ' loser';
  if(pickable) cls += ' pickable';

  const label = slot.name ? (slot.isBye ? 'Bye' : esc(slot.name)) : 'TBD';
  const attrs = pickable ? `data-pick-match="${m.id}" data-pick-name="${esc(slot.name)}"` : '';
  return `<div class="${cls}" ${attrs}><span class="nm">${label}</span>${pickable?'<span class="tap-hint">TAP&nbsp;TO&nbsp;WIN</span>':''}</div>`;
}

function renderMatchCard(bracket, m){
  const status = m.winner ? 'done' : (m.slot1.name && m.slot2.name ? 'ready' : '');
  return `<div class="match-card ${status}">
    ${renderSlot(bracket,m,1)}
    ${renderSlot(bracket,m,2)}
  </div>`;
}

function renderRoundRow(bracket, section){
  const rounds = byRound(bracket.matches, section);
  if(!rounds.length) return '<div class="gf2-inactive">Nothing here yet.</div>';
  const cols = rounds.map(roundMatches=>{
    const label = roundMatches[0].roundLabel;
    const gapPx = Math.min(14 + (roundMatches.length<=1?0:0), 14); // base spacing; visual rhythm via card margins below
    const cards = roundMatches.map(m=>`<div style="margin:10px 0;">${renderMatchCard(bracket,m)}</div>`).join('');
    return `<div class="round-col"><div class="round-title">${esc(label)}</div><div class="match-stack" style="justify-content:space-around; flex:1;">${cards}</div></div>`;
  }).join('');
  return `<div class="bracket-scroll"><div class="round-row">${cols}</div></div>`;
}

function renderGrandFinal(bracket){
  const gf1 = bracket.matches.find(m=>m.type==='GF1');
  const gf2 = bracket.matches.find(m=>m.type==='GF2');
  let html = `<div class="gf-note">The Winners-bracket player only needs to win once here. If the Losers-bracket player wins Match 1, they play a deciding Match 2 for the title.</div>`;
  html += `<div class="bracket-scroll"><div class="round-row">`;
  html += `<div class="round-col"><div class="round-title">Grand Final</div><div class="match-stack"><div style="margin:10px 0;">${renderMatchCard(bracket,gf1)}</div></div></div>`;
  if(gf2.active){
    html += `<div class="round-col"><div class="round-title">Decider Match</div><div class="match-stack"><div style="margin:10px 0;">${renderMatchCard(bracket,gf2)}</div></div></div>`;
  } else {
    html += `<div class="round-col"><div class="round-title">Decider Match</div><div class="gf2-inactive" style="margin:10px 8px;">Only plays if the Losers-bracket finalist wins the Grand Final.</div></div>`;
  }
  html += `</div></div>`;
  return html;
}

/* ============================= RENDER: SCREENS ============================= */
function renderHeader(){
  return `<div class="app-header">
    <div class="kicker">Est. Backyard Tradition</div>
    <h1>SARALENE'S<br><span class="accent">REUNION OLYMPICS</span></h1>
    <div class="tagline">Bragging rights, bracketed.</div>
  </div>`;
}

function renderEventCard(id){
  const b = state.data.brackets[id];
  if(!b) return '';
  const done = !!b.champion;
  return `<div class="event-card ${done?'done':''}" data-open="${id}">
    <div class="ev-main">
      <div class="ev-game">${esc(b.game)}${b.name && b.name!==b.game ? ' · '+esc(b.name) : ''}</div>
      <div class="ev-meta">
        <span class="badge ${b.format==='double'?'gold':''}">${b.format==='double'?'Double Elim':'Single Elim'}</span>
        <span>${b.participants.length} players</span>
        <span>·</span>
        <span>${fmtDate(b.createdAt)}</span>
      </div>
      ${done ? `<div class="ev-meta"><span class="badge green">🏆 ${esc(b.champion)}</span></div>` : ''}
    </div>
    <div class="ev-trash" data-delete="${id}">✕</div>
  </div>`;
}

function renderHome(){
  const order = state.data.order;
  let list = '';
  if(order.length===0){
    list = `<div class="empty-state">
      <span class="emoji">🏅</span>
      <b>No events yet</b>
      Start your first bracket — Cornhole, Billiards, whatever's on deck this year.
    </div>`;
  } else {
    const groups = {};
    order.forEach(id=>{
      const b = state.data.brackets[id];
      if(!b) return;
      const y = bracketYear(b);
      (groups[y] = groups[y] || []).push(id);
    });
    const years = Object.keys(groups).sort((a,b)=>b-a);
    list = years.map(y=>{
      const ids = groups[y];
      const collapsed = !!state.collapsedYears[y];
      const doneCount = ids.filter(id=>state.data.brackets[id] && state.data.brackets[id].champion).length;
      const cards = collapsed ? '' : ids.map(renderEventCard).join('');
      return `<div class="year-group">
        <div class="year-header" data-toggle-year="${y}">
          <span class="year-chevron">${collapsed?'▸':'▾'}</span>
          <span class="year-title">${esc(y)} Reunion</span>
          <span class="year-count">${ids.length} event${ids.length===1?'':'s'}${doneCount?` · ${doneCount} decided`:''}</span>
        </div>
        ${collapsed ? '' : `<div class="year-cards">${cards}</div>`}
      </div>`;
    }).join('');
  }

  return `
    ${renderHeader()}
    <div class="home-body">
      <div class="new-event-btn" data-newbracket="1">+ &nbsp;New Event</div>
      <div class="section-label">Your Brackets</div>
      ${list}
    </div>
  `;
}

function renderNew(){
  const f = state.form;
  const names = f.text.split('\n').map(s=>s.trim()).filter(Boolean);
  return `
    <div class="back-row">
      <div class="icon-btn" data-gohome="1">← Back</div>
    </div>
    <div class="form-body">
      <div class="field">
        <label>Reunion Year</label>
        <div class="year-stepper">
          <div class="ys-btn" data-year-step="-1">−</div>
          <div class="ys-value">${f.year}</div>
          <div class="ys-btn" data-year-step="1">+</div>
        </div>
        <div class="count-hint">Groups this event with the rest of that year's reunion on the home screen.</div>
      </div>

      <div class="field">
        <label>Which Game</label>
        <input class="text-input" id="gameNameInput" placeholder="Cornhole, Billiards, Horseshoes..." value="${esc(f.name)}">
      </div>

      <div class="field">
        <label>Format</label>
        <div class="format-row">
          <div class="format-opt ${f.format==='single'?'active':''}" data-format="single">
            <div class="ft">Single Elim</div>
            <div class="fd">One loss and you're out. Fast &amp; simple.</div>
          </div>
          <div class="format-opt ${f.format==='double'?'active':''}" data-format="double">
            <div class="ft">Double Elim</div>
            <div class="fd">Lose once, drop to the losers bracket. Lose twice, you're out.</div>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Players — one per line</label>
        <textarea id="participantsInput" placeholder="Uncle Rick&#10;Cousin Dana&#10;Saralene&#10;...">${esc(f.text)}</textarea>
        <div class="count-hint">${names.length} player${names.length===1?'':'s'} entered ${names.length>=2 ? '· byes fill any empty slots to round out the bracket' : ''}</div>
        ${f.error ? `<div class="err-msg">${esc(f.error)}</div>` : ''}
      </div>

      <div class="generate-btn" data-generate="1">Generate Bracket</div>
    </div>
  `;
}

function renderBracket(){
  const b = state.data.brackets[state.currentId];
  if(!b){ state.view='home'; return renderHome(); }

  let tabsHtml = '';
  let content = '';
  if(b.format==='double'){
    tabsHtml = `<div class="tabs">
      <div class="tab ${state.bracketTab==='W'?'active':''}" data-tab="W">Winners</div>
      <div class="tab ${state.bracketTab==='L'?'active':''}" data-tab="L">Losers</div>
      <div class="tab ${state.bracketTab==='GF'?'active':''}" data-tab="GF">Final</div>
    </div>`;
    if(state.bracketTab==='W') content = renderRoundRow(b,'W');
    else if(state.bracketTab==='L') content = renderRoundRow(b,'L');
    else content = renderGrandFinal(b);
  } else {
    content = renderRoundRow(b,'W');
  }

  const championBanner = b.champion ? `<div class="champion-banner">
      <div class="cb-label">Champion</div>
      <div class="cb-name">🏆 ${esc(b.champion)}</div>
    </div>` : '';

  const yearControl = state.editingYear ? `
      <div class="year-stepper" style="margin-top:8px;">
        <div class="ys-btn" data-bracket-year-step="-1">−</div>
        <div class="ys-value">${bracketYear(b)}</div>
        <div class="ys-btn" data-bracket-year-step="1">+</div>
        <div class="icon-btn" style="padding:8px 12px; font-size:12px;" data-year-done="1">Done</div>
      </div>` :
      `<span class="badge gold" data-edit-year="1" style="cursor:pointer;">${bracketYear(b)} ✎</span>`;

  return `
    <div class="back-row">
      <div class="icon-btn" data-gohome="1">← Events</div>
      <div class="icon-btn danger" data-delete="${b.id}">Delete</div>
    </div>
    <div class="bracket-head">
      <div class="ev-game">${esc(b.game)}${b.name && b.name!==b.game ? ' · '+esc(b.name):''}</div>
      <div class="ev-meta">
        ${yearControl}
        <span class="badge ${b.format==='double'?'gold':''}">${b.format==='double'?'Double Elim':'Single Elim'}</span>
        <span>${b.participants.length} players</span>
      </div>
    </div>
    ${championBanner}
    ${tabsHtml}
    ${content}
  `;
}

/* ============================= MAIN RENDER + EVENTS ============================= */
function renderSaveBanner(){
  if(!state.saveError) return '';
  return `<div class="save-banner">
    <span class="sb-text">⚠ Couldn't sync your last change. It's still here on this screen — tap retry to save it.</span>
    <button class="sb-retry" data-retry-save="1">Retry</button>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  if(state.loading){ app.innerHTML = `<div class="loading">Loading your brackets…</div>`; return; }
  let html = renderSaveBanner();
  if(state.view==='home') html += renderHome();
  else if(state.view==='new') html += renderNew();
  else if(state.view==='bracket') html += renderBracket();
  app.innerHTML = html;
  attachEvents();
}

function attachEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-newbracket]').forEach(el=>el.addEventListener('click', ()=>{
    state.form = { name:'', format:'single', text:'', year: currentYear(), error:'' };
    state.view = 'new';
    render();
  }));

  app.querySelectorAll('[data-gohome]').forEach(el=>el.addEventListener('click', ()=>{
    state.view = 'home';
    state.editingYear = false;
    render();
  }));

  app.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target.closest('[data-delete]')) return;
    state.currentId = el.getAttribute('data-open');
    state.bracketTab = 'W';
    state.editingYear = false;
    state.view = 'bracket';
    render();
  }));

  app.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const id = el.getAttribute('data-delete');
    const b = state.data.brackets[id];
    const nm = b ? (b.game + (b.name && b.name!==b.game ? ' · '+b.name : '')) : 'this bracket';
    if(confirm(`Delete "${nm}"? This can't be undone.`)){
      deleteBracket(id);
      if(state.currentId===id){ state.currentId=null; state.view='home'; }
      render();
    }
  }));

  const gameInput = document.getElementById('gameNameInput');
  if(gameInput) gameInput.addEventListener('input', (e)=>{ state.form.name = e.target.value; });

  app.querySelectorAll('[data-format]').forEach(el=>el.addEventListener('click', ()=>{
    state.form.format = el.getAttribute('data-format');
    render();
  }));

  const pInput = document.getElementById('participantsInput');
  if(pInput){
    pInput.addEventListener('input', (e)=>{ state.form.text = e.target.value; });
    // keep cursor / avoid full re-render jank while typing: update count only
    pInput.addEventListener('blur', ()=>{ render(); });
  }

  app.querySelectorAll('[data-year-step]').forEach(el=>el.addEventListener('click', ()=>{
    state.form.year += parseInt(el.getAttribute('data-year-step'), 10);
    render();
  }));

  app.querySelectorAll('[data-generate]').forEach(el=>el.addEventListener('click', ()=>{
    const f = state.form;
    const names = f.text.split('\n').map(s=>s.trim()).filter(Boolean);
    const gameName = f.name.trim();
    if(!gameName){
      f.error = 'Name the game for this event.';
      render();
      return;
    }
    if(names.length < 2){
      f.error = 'Add at least 2 players.';
      render();
      return;
    }
    const id = createBracket(gameName, gameName, f.format, names, f.year);
    state.currentId = id;
    state.bracketTab = 'W';
    state.view = 'bracket';
    render();
  }));

  app.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click', ()=>{
    state.bracketTab = el.getAttribute('data-tab');
    render();
  }));

  app.querySelectorAll('[data-pick-match]').forEach(el=>el.addEventListener('click', ()=>{
    const b = state.data.brackets[state.currentId];
    if(!b) return;
    const matchId = el.getAttribute('data-pick-match');
    const name = el.getAttribute('data-pick-name');
    declareWinner(b, matchId, name);
  }));

  app.querySelectorAll('[data-toggle-year]').forEach(el=>el.addEventListener('click', ()=>{
    const y = el.getAttribute('data-toggle-year');
    state.collapsedYears[y] = !state.collapsedYears[y];
    render();
  }));

  app.querySelectorAll('[data-edit-year]').forEach(el=>el.addEventListener('click', ()=>{
    state.editingYear = true;
    render();
  }));

  app.querySelectorAll('[data-year-done]').forEach(el=>el.addEventListener('click', ()=>{
    state.editingYear = false;
    render();
  }));

  app.querySelectorAll('[data-bracket-year-step]').forEach(el=>el.addEventListener('click', ()=>{
    const b = state.data.brackets[state.currentId];
    if(!b) return;
    setBracketYear(b.id, bracketYear(b) + parseInt(el.getAttribute('data-bracket-year-step'), 10));
    render();
  }));

  app.querySelectorAll('[data-retry-save]').forEach(el=>el.addEventListener('click', ()=>{
    saveData();
  }));
}

/* ============================= INIT ============================= */
loadData();
</script>
